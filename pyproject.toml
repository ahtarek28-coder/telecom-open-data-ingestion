[project]
name = "odingest"
version = "0.1.0"
description = "Ingestion of real telecom-related public data (FCC complaints, World Bank indicators) via legitimate APIs"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "click>=8.1",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "responses>=0.25"]

[project.scripts]
odingest = "odingest.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["odingest*"]
