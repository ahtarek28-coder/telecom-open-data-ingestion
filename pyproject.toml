[project]
name = "odingest"
version = "0.1.0"
description = "Ingestion of real telecom-related public data (FCC complaints, World Bank indicators) via legitimate APIs"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "click>=8.1",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "responses>=0.25"]
# Not a library dependency of odingest itself -- only needed to run the
# dq_check step in dags/telecom_open_data_dag.py.
dq = ["dqcheck[duckdb] @ git+https://github.com/ahtarek28-coder/data-quality-toolkit.git"]

[project.scripts]
odingest = "odingest.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["odingest*"]
